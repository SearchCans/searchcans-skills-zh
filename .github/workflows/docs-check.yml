name: 检查自动生成的中文文档

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/generate_docs.py"
      - "scripts/sync_wiki.py"
      - "skills/**/SKILL.md"
      - "README.md"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/generate_docs.py"
      - "scripts/sync_wiki.py"
      - "skills/**/SKILL.md"
      - "README.md"
      - "tests/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/generate_docs.py --check
      - run: python -m unittest discover -s tests -v
